name: Fix sign-in banner button

on:
  push:
    branches:
      - agent/show-signin-button-banner
    paths:
      - .github/workflows/fix-signin-banner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/show-signin-button-banner
      - name: Make signed-out button state explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('firebase-sync.js')
          text = path.read_text(encoding='utf-8')

          old = """function updatePresentation(user) {
            if (!panel) return;
            panel.classList.toggle('is-signed-in', Boolean(user));
            panel.classList.toggle('needs-sign-in', !user);
            titleText.textContent = user ? 'Trip cloud sync' : 'Sign in to sync your whole trip';
            signInButton.hidden = Boolean(user);
            signOutButton.hidden = !user;
          }
"""
          new = """function updatePresentation(user) {
            if (!panel) return;
            const signedIn = Boolean(user);
            panel.classList.toggle('is-signed-in', signedIn);
            panel.classList.toggle('needs-sign-in', !signedIn);
            titleText.textContent = signedIn ? 'Trip cloud sync' : 'Sign in to sync your whole trip';
            signInButton.hidden = signedIn;
            signOutButton.hidden = !signedIn;
            signInButton.setAttribute('aria-hidden', signedIn ? 'true' : 'false');
            signOutButton.setAttribute('aria-hidden', signedIn ? 'false' : 'true');
          }
"""

          old_css = """    .firebase-sync-actions{display:flex;gap:8px;flex-wrap:wrap}.firebase-sync-actions button{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer;white-space:nowrap}
"""
          new_css = """    .firebase-sync-actions{display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto;visibility:visible;opacity:1}.firebase-sync-actions button{align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer;white-space:nowrap}
    .firebase-sync-panel.needs-sign-in [data-sync-sign-in]{display:inline-flex!important;visibility:visible!important;opacity:1!important}.firebase-sync-panel.needs-sign-in [data-sync-sign-out]{display:none!important}.firebase-sync-panel.is-signed-in [data-sync-sign-in]{display:none!important}.firebase-sync-panel.is-signed-in [data-sync-sign-out]{display:inline-flex!important}
"""

          old_mount = """  signInButton = panel.querySelector('[data-sync-sign-in]');
            signOutButton = panel.querySelector('[data-sync-sign-out]');
            document.body.prepend(panel);

            signInButton.addEventListener('click', handleSignIn);
"""
          new_mount = """  signInButton = panel.querySelector('[data-sync-sign-in]');
            signOutButton = panel.querySelector('[data-sync-sign-out]');
            document.body.prepend(panel);

            // Authentication may resolve before DOMContentLoaded. Reapply the
            // current state after the banner exists so the correct action is
            // always visible.
            setAccount(currentUser);
            updatePresentation(currentUser);

            signInButton.addEventListener('click', handleSignIn);
"""

          for before, after, label in [
              (old, new, 'presentation'),
              (old_css, new_css, 'actions css'),
              (old_mount, new_mount, 'mount state')
          ]:
              if before not in text:
                  raise SystemExit(f'{label} block not found')
              text = text.replace(before, after, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check firebase-sync.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase-sync.js
          git commit -m "Keep Google sign-in visible in sync banner"
          git push
